<div class="status-pill" [ngClass]="statusClass">
  <span class="status-dot"></span>
  <span class="status-label">{{ statusLabelKey | translate }}</span>
  <span *ngIf="showHint && status !== 'running'" class="hint-badge">
    {{ (status === 'stopped' ? 'hintStoppedTitle' : 'hintMaintenanceTitle') | translate }}
  </span>
</div>
