<div class="gauge-card">
  <div class="gauge-header">
    <h4 class="gauge-title">{{ 'orderProgress' | translate }}</h4>
    <span class="order-badge" *ngIf="orderNumber">{{ 'orderPrefix' | translate }}{{ orderNumber }}</span>
  </div>

  <div class="gauge-body">
    <div #gaugeContainer class="gauge-svg-container"></div>
    
    <div class="progress-details">
      <div class="detail-row">
        <span class="detail-label">{{ 'targetUnits' | translate }}</span>
        <span class="detail-value">{{ target | number }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">{{ 'producedSoFar' | translate }}</span>
        <span class="detail-value highlight">{{ produced | number }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">{{ 'remaining' | translate }}</span>
        <span class="detail-value">{{ (target > produced ? target - produced : 0) | number }}</span>
      </div>
    </div>
  </div>
</div>
