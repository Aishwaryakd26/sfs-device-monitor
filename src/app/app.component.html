<div class="app-shell" *ngIf="config$ | async as config">
  <!-- Enterprise Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">{{ 'appTitle' | translate }}</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Dynamic Language Switcher (EN / DE) -->
      <app-lang-switcher 
        [availableLanguages]="config.availableLanguages || ['en', 'de']"
      ></app-lang-switcher>

      <!-- Dynamic Environment Indicator -->
      <app-env-badge 
        [environmentName]="config.environmentName"
        [environmentColour]="config.environmentColour"
      ></app-env-badge>

      <div class="header-status">
        <span class="pulse-dot"></span>
        <span class="status-text">{{ 'coreApiLive' | translate }}</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace with Modern Router Outlet -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Centralized Toast Notifications -->
  <app-toast-container></app-toast-container>
</div>
